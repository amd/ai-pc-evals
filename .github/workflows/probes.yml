name: probe tests

# The tests that need the answers (they run the checker scripts against right and wrong work, and read the keys):
# they skip in tests.yml, which has no passphrase. Here they run with it, from the answers environment, which only
# main and v* tags can use: on every push to main, weekly, by hand, and from release.yml before a tag publishes.
# Not a pull-request check (a pull request's branch can't use the environment). A failing test's message can quote
# an expected value and the log is public, so tools/ci_probe_tests.py prints test ids and outcomes only.
on:
  push:
    branches: [main]
  schedule:
    - cron: "47 5 * * 1"  # Mondays 05:47 UTC
  workflow_dispatch:
  workflow_call:  # release.yml: a tag publishes only if these pass
    secrets:  # a caller must pass it (release.yml: secrets: inherit); missing, the run fails rather than skips
      KW_ANSWERS_PASSPHRASE:
        required: true

permissions:
  contents: read

jobs:
  probes:
    environment: answers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements-dev.txt -c constraints.txt
      - name: The probe tests, with the answers (ids and outcomes only in the log)
        env:
          KW_ANSWERS_PASSPHRASE: ${{ secrets.KW_ANSWERS_PASSPHRASE }}
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          echo "::add-mask::$KW_ANSWERS_PASSPHRASE"
          python tools/ci_probe_tests.py
