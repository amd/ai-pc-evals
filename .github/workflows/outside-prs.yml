name: outside-prs

# This repository takes issues, not pull requests, from outside contributors (CONTRIBUTING.md).
# pull_request_target runs with the base repository's token but never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: ${{ github.event.pull_request.user.type != 'Bot' && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Close with a pointer to issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR" --comment "Thanks for taking the time. This repository doesn't accept pull requests from outside contributors, to keep it light to maintain (see CONTRIBUTING.md). Please open an issue describing the problem or idea instead: issues are welcome and the maintainers act on them."
