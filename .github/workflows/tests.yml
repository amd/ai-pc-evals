name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        # 3.14: the Linux eval boxes' Python (Ubuntu 26.04), and on Windows the one that ships zlib-ng (#60)
        python: ["3.13", "3.14"]
        include:  # and the oldest Python the docs allow, on the platform the evals run on
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Compile every script
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.py')
          python -m py_compile "${files[@]}"
      - name: Shell syntax
        shell: bash
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - run: python -m pytest -q

  # The release zip, installed in a clean folder, runs one task end to end with a stub agent (no model, no
  # key, --no-grade): catches a file the package leaves out and a break in run_eval.py's run path.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build, install and run the release zip
        run: python tools/smoke.py
