name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # release.yml runs these same jobs on a tag before it publishes

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        # 3.14: the Linux eval boxes' Python (Ubuntu 26.04), and on Windows the one that ships zlib-ng (#60)
        python: ["3.13", "3.14"]
        include:  # and the oldest Python the docs allow, on the platform the evals run on
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Compile every script
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.py')
          python -m py_compile "${files[@]}"
      - name: Shell syntax
        shell: bash
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - run: python -m pytest -q -rs  # -rs: every skip and its reason, in the log

  # Linux Layer 4 for real (#59): agents and probes as a separate user through sudo, POSIX ACLs, the sticky bit,
  # and cron and timer containment, which the pytest job covers only with mocks. GitHub's Ubuntu runners have
  # passwordless sudo. The agent user is set up with the script docs/ISOLATION.md tells you to run.
  pytest-layer4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: System packages (ACLs, cron, the user bus for systemctl --user)
        run: sudo apt-get update -q && sudo apt-get install -y -q acl cron dbus-user-session python3-venv
      # GitHub's runners leave /opt writable by every user, so the agent user could replace the checkers' Python in
      # it (the setup script checks this and stops); an eval box's /opt is root's, 755.
      - name: Make /opt root's only, as on an eval box
        run: sudo chmod o-w /opt
      - name: Set up the agent user as docs/ISOLATION.md says
        run: bash tools/setup_layer4_linux.sh
      - name: A systemd user manager for you and for the agent user (their timers)
        run: |
          sudo loginctl enable-linger "$USER" kwagent
          # /run/user/<uid> is open to its user only: sudo to see the agent user's
          for uid in "$(id -u)" "$(id -u kwagent)"; do
            for _ in $(seq 30); do sudo test -S "/run/user/$uid/systemd/private" && break; sleep 1; done
            sudo test -S "/run/user/$uid/systemd/private" || { echo "::error::no user manager for uid $uid"; exit 1; }
          done
      - name: The tests in a virtual environment, as on an eval box
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements-dev.txt -c constraints.txt
      - name: Layer 4 tests for real, none of them skipped
        env:
          KW_TEST_AGENT_USER: kwagent
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"  # your own user manager, as a signed-in session has it
          export XDG_RUNTIME_DIR
          set +e
          .venv/bin/python -m pytest -q -rs tests/test_isolation.py tests/test_schedules.py tests/test_preflight.py \
            tests/test_agents.py | tee pytest.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -E "^SKIPPED .*(KW_TEST_AGENT_USER|virtual environment|user manager)" pytest.log; then
            echo "::error::a test that needs the agent user, its user manager or a virtual environment was skipped: it must run here"
            exit 1
          fi
          exit "$code"

  # The release zip, installed in a clean folder, runs one task end to end with a stub agent (no model, no
  # key, --no-grade): catches a file the package leaves out and a break in run_eval.py's run path.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build, install and run the release zip
        run: python tools/smoke.py
