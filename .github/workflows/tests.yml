name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile every script
        shell: bash
        run: python -m py_compile $(git ls-files '*.py')
      - name: Shell syntax
        shell: bash
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - run: python -m pytest -q
