name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.1 shellcheck-py==0.11.0.1
      - name: Python (undefined names, unused code, syntax)
        run: ruff check --output-format github .
      - name: Shell scripts
        run: shellcheck -S warning $(git ls-files '*.sh')
      - name: JSON files parse
        run: for f in $(git ls-files '*.json' ':!knowledgework/assistant/corpus/**'); do python -m json.tool "$f" >/dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }; done
      - name: Scripts are committed with LF
        run: |
          bad=$(git ls-files --eol -- '*.sh' '*.py' '*.bat' '*.cmd' '*.ps1' ':!knowledgework/assistant/corpus/**' | grep -v '^i/lf' || true)
          if [ -n "$bad" ]; then echo "::error::committed with CRLF or mixed endings:"; echo "$bad"; exit 1; fi
      - name: Checkout line endings follow .gitattributes
        run: |
          # Bash rejects CRLF scripts; cmd.exe mis-parses LF batch files.
          bad=$( { git ls-files --eol -- '*.sh' | grep -v 'w/lf'; git ls-files --eol -- '*.bat' '*.cmd' | grep -v 'w/crlf'; } || true)
          if [ -n "$bad" ]; then echo "::error::wrong line endings in the checkout:"; echo "$bad"; exit 1; fi
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in git ls-files '*.ps1') {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { "::error file=$f::$_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
