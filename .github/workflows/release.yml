name: release

# Push a tag that matches VERSION (e.g. v0.6.1) to publish the package as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches VERSION (before anything slow)
        run: test "v$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$(cat VERSION)"; exit 1; }

  # The same jobs a pull request must pass, run on the tagged commit itself: every pytest leg (both systems, each
  # Python), the Linux Layer 4 tests for real, the release-zip smoke run, and lint. A tag can't publish what
  # main's CI would reject. They get this workflow's read-only token.
  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  lint:
    needs: version
    uses: ./.github/workflows/lint.yml

  package:
    needs: [tests, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can write, and it runs no tests and installs nothing beyond what packaging needs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release notes from CHANGELOG.md (fails if this version has none)
        run: python tools/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Build the package
        run: python tools/package.py --out dist --tag "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "AI PC evals $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
