name: release

# Push a tag that matches VERSION (e.g. v0.6.1) to publish the package as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches VERSION (before anything slow)
        run: test "v$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$(cat VERSION)"; exit 1; }

  # Every check workflow, run on the tagged commit itself, and package needs them all: a tag can't publish what
  # CI would reject. The jobs a pull request must pass (every pytest leg, the Linux Layer 4 tests, the release-zip
  # smoke run, lint; fingerprint-note runs on pull requests only and is skipped here), the probe tests with the
  # answers, the pinned-source check, the dependency audit and the agent CLIs' flags. tests/test_workflows.py checks
  # that every workflow but this one and outside-prs.yml is called here and needed by package.
  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  lint:
    needs: version
    uses: ./.github/workflows/lint.yml

  # These two use the answers environment (its KW_ANSWERS_PASSPHRASE secret), which must allow v* tags as well as
  # main. The environment hands the called jobs its secret itself: nothing is passed from here.
  probes:
    needs: version
    uses: ./.github/workflows/probes.yml

  # issues: write only because the called workflow's weekly report job declares it, and a called job can't ask for
  # more than its caller grants. That job runs on the weekly schedule (or by hand) only, so here it is skipped and
  # files nothing; the checking jobs run with contents: read.
  sources:
    needs: version
    uses: ./.github/workflows/sources.yml
    permissions:
      contents: read
      issues: write

  audit:
    needs: version
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read
      issues: write

  agent-clis:
    needs: version
    uses: ./.github/workflows/agent-clis.yml
    permissions:
      contents: read
      issues: write

  package:
    needs: [tests, lint, probes, sources, audit, agent-clis]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can write, and it runs no tests and installs nothing beyond what packaging needs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release notes from CHANGELOG.md (fails if this version has none)
        run: python tools/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Build the package
        run: python tools/package.py --out dist --tag "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "AI PC evals $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
