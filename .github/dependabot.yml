version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # requirements.txt and requirements-dev.txt. Bumps to the libraries that build inputs or
  # extract what the judge reads change grades: re-grade before merging (see CONTRIBUTING.md).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
